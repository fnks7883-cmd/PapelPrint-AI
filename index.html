<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Central de Ferramentas</title>
    <style>
        body { background-color: #0b1020; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 10px; padding: 20px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #29354f; }
        .input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; }
        .ia { background: #29354f; align-self: flex-start; }
        .user { background: #2563eb; margin-left: auto; }
        .key-area { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; border: 1px solid #facc15; }
        .status-ready { color: #22c55e; font-weight: bold; }
        .status-off { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🧠 PapelPrint AI</h1>
            <div id="status-badge" class="status-off">MOTOR DESCONECTADO</div>
        </header>
        
        <div class="key-area">
            <strong>⚠️ Ativação:</strong> Cole sua chave (mesmo se começar com AQ) e clique em Conectar.
            <div style="margin-top:10px;">
                <input type="password" id="apiKey" placeholder="Cole sua chave aqui..." style="width: 70%;">
                <button onclick="saveKey()">Conectar IA</button>
            </div>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Olá! Estou pronto para ser ativado. Cole sua chave acima para liberarmos as habilidades dos seus repositórios (Vectorcraft, PDFcraft, etc.).</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="O que vamos fazer hoje?">
            <button onclick="askIA()">Enviar</button>
        </div>
        <div id="debugLog" style="font-size: 11px; color: #facc15; margin-top: 5px;"></div>
    </div>

    <script>
        let API_KEY = "";
        
        const SKILLS_CONTEXT = `Você é o PapelPrint AI. Você é um especialista em artes gráficas e automação.
        Habilidades integradas:
        - Vectorcraft: Artes vetoriais e SVG.
        - PDFcraft: Manipulação e Preflight de PDF.
        - Wordcraft: Timbrados e documentos.
        Responda de forma profissional e direta.`;

        function saveKey() {
            API_KEY = document.getElementById('apiKey').value.trim();
            if (API_KEY) {
                document.getElementById('status-badge').innerText = "MOTOR PRONTO";
                document.getElementById('status-badge').className = "status-ready";
                addMsg("ia", "Conexão estabelecida! O motor está aquecido. Pode mandar seu pedido.");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function askIA() {
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value;
            if (!prompt || !API_KEY) return alert("Por favor, conecte a chave primeiro!");

            addMsg("user", prompt);
            inputField.value = "";
            const log = document.getElementById('debugLog');
            log.innerText = "IA está processando as ferramentas Craft...";

            try {
                // Versão v1beta - Aceita chaves novas (AQ) e antigas (AIza)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: SKILLS_CONTEXT + "\n\nPedido do usuário: " + prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    addMsg("ia", "Ocorreu um problema com a chave: " + data.error.message);
                    log.innerText = "Erro: " + data.error.status;
                } else {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMsg("ia", reply);
                    log.innerText = "Resposta gerada com sucesso.";
                }
            } catch (error) {
                addMsg("ia", "Erro técnico de conexão. Tente desativar extensões de bloqueio de anúncio.");
                log.innerText = "Erro: " + error.message;
            }
        }
    </script>
</body>
</html>
