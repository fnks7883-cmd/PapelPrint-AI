<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Central de Ferramentas</title>
    <style>
        body { background-color: #0b1020; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 10px; padding: 20px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #29354f; }
        .input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; }
        .ia { background: #29354f; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #2563eb; margin-left: auto; border-bottom-right-radius: 2px; }
        .key-area { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; display: flex; align-items: center; gap: 10px; }
        .status { font-size: 12px; color: #facc15; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🧠 PapelPrint AI</h1>
            <div id="status-badge" style="background: #ef4444; padding: 5px 10px; border-radius: 20px; font-size: 10px;">IA OFFLINE</div>
        </header>
        
        <div class="key-area">
            <span>Chave API Gemini:</span>
            <input type="password" id="apiKey" placeholder="Cole sua chave aqui..." style="padding: 5px; font-size: 12px;">
            <button onclick="saveKey()" style="padding: 5px 10px; font-size: 10px;">Conectar IA</button>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Olá! Insira sua chave API do Google AI Studio acima para ativar minhas skills (Vectorcraft, PDFcraft, Wordcraft, etc.).</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Descreva a tarefa gráfica ou automação...">
            <button id="sendBtn" onclick="askIA()">Enviar</button>
        </div>
        
        <div class="status" id="statusLog">Aguardando chave de ativação...</div>
    </div>

    <script>
        let API_KEY = "";
        
        const SKILLS_CONTEXT = `Você é o PapelPrint AI. Você tem integradas as habilidades dos seguintes repositórios:
        1. Vectorcraft: Criação de artes vetoriais e SVG com sangria.
        2. PDFcraft: Manipulação de PDFs (unir, separar, preflight gráfico).
        3. Wordcraft: Documentos dinâmicos e papel timbrado.
        4. Photocraft/Lightcraft: Edição de cor e imagem.
        5. Vibe Toolkit: Automação e prompts otimizados.
        Sempre responda de forma técnica, ajudando o usuário a resolver problemas de impressão e design usando essas ferramentas.`;

        function saveKey() {
            API_KEY = document.getElementById('apiKey').value;
            if (API_KEY) {
                document.getElementById('status-badge').innerText = "IA PRONTA";
                document.getElementById('status-badge').style.background = "#22c55e";
                document.getElementById('statusLog').innerText = "Conexão estabelecida com sucesso!";
                addMsg("ia", "Chave conectada! Agora posso usar as ferramentas Craft para te ajudar. O que vamos criar hoje?");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function askIA() {
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value;
            if (!prompt || !API_KEY) {
                alert("Insira a chave API e digite uma mensagem!");
                return;
            }

            addMsg("user", prompt);
            inputField.value = "";
            document.getElementById('statusLog').innerText = "IA processando habilidades Craft...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: SKILLS_CONTEXT + "\n\nUsuário: " + prompt }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                addMsg("ia", reply);
                document.getElementById('statusLog').innerText = "Pronto.";
            } catch (error) {
                addMsg("ia", "Erro ao conectar com a IA. Verifique sua chave.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
