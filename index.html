<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Central de Ferramentas</title>
    <style>
        body { background-color: #0b1020; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 10px; padding: 20px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #29354f; }
        .input-area { display: flex; gap: 10px; padding-bottom: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; }
        .ia { background: #29354f; align-self: flex-start; }
        .user { background: #2563eb; margin-left: auto; }
        .key-area { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .status-ready { color: #22c55e; font-weight: bold; }
        .status-off { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🧠 PapelPrint AI</h1>
            <div id="status-badge" class="status-off">IA DESCONECTADA</div>
        </header>
        
        <div class="key-area">
            <span>Chave API Gemini:</span>
            <input type="password" id="apiKey" placeholder="Cole sua chave aqui e clique em conectar..." style="margin: 0 10px; padding: 8px; width: 60%;">
            <button onclick="saveKey()" style="padding: 8px 15px;">Conectar</button>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Olá! Insira sua chave API do Google Studio acima para ativar minhas habilidades Craft.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="O que vamos criar hoje?">
            <button onclick="askIA()">Enviar</button>
        </div>
        <div id="debugLog" style="font-size: 10px; color: #64748b; margin-top: 5px;"></div>
    </div>

    <script>
        let API_KEY = "";
        
        const SKILLS_CONTEXT = `Você é o PapelPrint AI. Você integra ferramentas gráficas e automação:
        - Vectorcraft (SVG/Vetores/Sangria)
        - PDFcraft (Unir/Separar/Preflight)
        - Wordcraft (Documentos/Timbrados)
        - Photocraft (Edição de imagem)
        Responda de forma prestativa e técnica sobre esses temas.`;

        function saveKey() {
            const rawKey = document.getElementById('apiKey').value;
            API_KEY = rawKey.trim(); // Remove espaços extras
            if (API_KEY) {
                document.getElementById('status-badge').innerText = "IA PRONTA";
                document.getElementById('status-badge').className = "status-ready";
                addMsg("ia", "Chave salva com sucesso! Pode digitar seu pedido.");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function askIA() {
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value;
            if (!prompt || !API_KEY) return alert("Insira a chave e a mensagem!");

            addMsg("user", prompt);
            inputField.value = "";
            const log = document.getElementById('debugLog');
            log.innerText = "IA pensando...";

            try {
                // Usando a versão v1 estável
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: SKILLS_CONTEXT + "\n\nPergunta: " + prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    addMsg("ia", "Erro do Google: " + data.error.message);
                    log.innerText = "Falha na conexão.";
                } else {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMsg("ia", reply);
                    log.innerText = "Resposta recebida.";
                }
            } catch (error) {
                addMsg("ia", "Erro técnico: Não foi possível alcançar o servidor da IA. Verifique sua internet ou AdBlock.");
                log.innerText = error.message;
            }
        }
    </script>
</body>
</html>
