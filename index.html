<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Oficial</title>
    <style>
        body { background: #0b1020; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-grow: 1; flex-direction: column; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #29354f; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .msg { margin-bottom: 15px; padding: 15px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
        .ia { background: #29354f; border-left: 5px solid #facc15; color: #e2e8f0; }
        .user { background: #2563eb; margin-left: 50px; color: white; border-right: 5px solid #60a5fa; }
        .config-bar { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #facc15; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="password"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #29354f; background: #0b1020; color: white; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #29354f; background: #1e293b; color: white; }
        button { background: #facc15; color: #0b1020; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #eab308; }
        #status { font-size: 12px; color: #facc15; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h1 style="margin:0; font-size: 24px;">🧠 PapelPrint AI</h1>
            <div id="status">Status: Aguardando Chave AIza...</div>
        </header>

        <div class="config-bar">
            <input type="password" id="apiKey" placeholder="Cole sua chave AIzaSy aqui...">
            <button onclick="conectar()">CONECTAR MOTOR</button>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Sistema Pronto. Conecte sua chave para ativar as habilidades dos 21 repositórios (Vectorcraft, PDFcraft, etc).</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="O que vamos criar agora?" onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let CHAVE_MESTRA = "";
        const CONTEXTO = "Você é o PapelPrint AI. Você domina 21 ferramentas: Vectorcraft, PDFcraft, Wordcraft, Lightcraft, Effectcraft, Filmcraft, Designcraft, Figcraft, Gridcraft, CADcraft, Photocraft, Soundcraft, Deckcraft, OpenMAIC, OmniRoute, Vibe Toolkit, Claude-mem, Headroom, OpenClaude, MonkeyCode, MiniMind. Responda de forma técnica, rápida e em português.";

        function conectar() {
            const k = document.getElementById('apiKey').value.trim();
            if (k.startsWith("AIza")) {
                CHAVE_MESTRA = k;
                document.getElementById('status').innerText = "✅ MOTOR CONECTADO";
                document.getElementById('status').style.color = "#22c55e";
                addMsg("ia", "Motor ativado com sucesso! Como posso ajudar com seus repositórios hoje?");
            } else {
                alert("A chave deve começar com AIza. Verifique se copiou corretamente.");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = "msg " + tipo;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            
            if (!texto || !CHAVE_MESTRA) {
                if(!CHAVE_MESTRA) alert("Por favor, conecte a chave primeiro!");
                return;
            }

            addMsg("user", texto);
            input.value = "";
            document.getElementById('status').innerText = "IA Processando...";

            try {
                // ENDPOINT ATUALIZADO V1BETA
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CHAVE_MESTRA}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: CONTEXTO + "\n\nUsuário: " + texto }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    const respostaIA = data.candidates[0].content.parts[0].text;
                    addMsg("ia", respostaIA);
                    document.getElementById('status').innerText = "✅ Online";
                } else {
                    const erro = data.error ? data.error.message : "Erro desconhecido";
                    addMsg("ia", "Erro na API: " + erro);
                    document.getElementById('status').innerText = "❌ Erro";
                }
            } catch (e) {
                addMsg("ia", "Erro de Conexão: " + e.message);
                document.getElementById('status').innerText = "❌ Offline";
            }
        }
    </script>
</body>
</html>
