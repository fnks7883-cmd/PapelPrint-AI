

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PapelPrint AI - Oficial</title>
    <style>
        body { background: #0b1020; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 800px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 10px; padding: 15px; overflow-y: auto; border: 1px solid #29354f; margin-bottom: 15px; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 8px; }
        .ia { background: #1e293b; color: #facc15; border-left: 4px solid #facc15; }
        .user { background: #2563eb; color: white; margin-left: 40px; }
        .bar { background: #1e293b; padding: 10px; border-radius: 8px; display: flex; gap: 10px; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #facc15; color: #0b1020; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #status { font-size: 12px; margin-bottom: 5px; color: #facc15; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 PapelPrint AI</h1>
        <div id="status">Status: Pronto para Chave AIza...</div>
        <div class="bar">
            <input type="password" id="key" placeholder="Cole aqui a chave AIzaSy...">
            <button onclick="conectar()">ATIVAR</button>
        </div>
        <div id="chat" class="chat-box"><div class="msg ia">Conecte sua chave para iniciar.</div></div>
        <div class="bar">
            <input type="text" id="in" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let KEY = "";
        function conectar() {
            KEY = document.getElementById('key').value.trim();
            if(KEY.startsWith("AIza")) {
                document.getElementById('status').innerText = "✅ Chave Carregada!";
                addMsg("ia", "Motor ativo. Se der erro 404, verifique se a Generative Language API está ATIVADA no Google Cloud.");
            }
        }

        function addMsg(t, m) {
            const c = document.getElementById('chat');
            const d = document.createElement('div');
            d.className = "msg " + t;
            d.innerText = m;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('in');
            const p = input.value;
            if(!p || !KEY) return;
            addMsg("user", p);
            input.value = "";

            try {
                // Tenta o modelo flash-latest que evita o erro 404 de modelo não encontrado
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${KEY}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: p}]}]})
                });
                
                const data = await res.json();
                if(data.candidates) {
                    addMsg("ia", data.candidates[0].content.parts[0].text);
                } else {
                    addMsg("ia", "Erro: " + (data.error ? data.error.message : "Desconhecido"));
                }
            } catch(e) {
                addMsg("ia", "Erro de conexão: " + e.message);
            }
        }
    </script>
</body>
</html>
