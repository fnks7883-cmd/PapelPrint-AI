<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Central</title>
    <style>
        body { background-color: #0b1020; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 800px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #29354f; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 12px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; }
        .ia { background: #29354f; align-self: flex-start; border-left: 4px solid #facc15; }
        .user { background: #2563eb; margin-left: auto; }
        .status { font-size: 12px; color: #facc15; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 PapelPrint AI</h1>
        
        <div style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #facc15;">
            <strong>🔑 Chave API:</strong>
            <input type="password" id="key" placeholder="Cole sua chave AQ aqui..." style="width: 60%; margin: 0 10px; padding: 5px;">
            <button onclick="conectar()" style="padding: 5px 15px;">CONECTAR</button>
        </div>

        <div id="status" class="status">Motor Offline</div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Olá! Cole sua chave acima para ativar as ferramentas Craft (Vector, PDF, Word, etc.).</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="O que vamos fazer hoje?">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let MINHA_CHAVE = "";
        const CONTEXTO = "Você é o PapelPrint AI, especialista em Vectorcraft, PDFcraft, Wordcraft e design gráfico. Responda de forma técnica.";

        function conectar() {
            MINHA_CHAVE = document.getElementById('key').value.trim();
            if(MINHA_CHAVE) {
                document.getElementById('status').innerText = "Motor Gemini 1.5 Flash Conectado";
                document.getElementById('status').style.color = "#22c55e";
                addMsg("ia", "Conexão estabelecida! O monstro saiu da jaula. Como posso ajudar?");
            }
        }

        function addMsg(t, txt) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${t}`;
            div.innerText = txt;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('userInput');
            const p = input.value;
            if(!p || !MINHA_CHAVE) return;

            addMsg("user", p);
            input.value = "";
            document.getElementById('status').innerText = "Processando skills...";

            try {
                // Forçando o modelo 1.5-flash que é o padrão gratuito e estável
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MINHA_CHAVE}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: CONTEXTO + "\n\nPergunta do Usuário: " + p }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    addMsg("ia", data.candidates[0].content.parts[0].text);
                    document.getElementById('status').innerText = "Pronto.";
                } else {
                    addMsg("ia", "Erro na resposta: " + (data.error ? data.error.message : "Resposta vazia do Google"));
                }
            } catch (e) {
                addMsg("ia", "Erro de conexão: " + e.message);
            }
        }
    </script>
</body>
</html>
