<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Oficial (Motor Groq)</title>
    <style>
        body { background: #0b1020; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-grow: 1; flex-direction: column; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #29354f; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .msg { margin-bottom: 15px; padding: 15px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; }
        .ia { background: #29354f; border-left: 5px solid #facc15; color: #e2e8f0; }
        .user { background: #2563eb; color: white; margin-left: 50px; border-right: 5px solid #60a5fa; }
        .config-bar { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #facc15; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="password"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #29354f; background: #0b1020; color: white; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #29354f; background: #1e293b; color: white; }
        button { background: #facc15; color: #0b1020; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #status { font-size: 12px; color: #facc15; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h1 style="margin:0; font-size: 24px;">🧠 PapelPrint AI</h1>
            <div id="status">Status: Aguardando Chave gsk_...</div>
        </header>

        <div class="config-bar">
            <input type="password" id="apiKey" placeholder="Cole sua chave gsk_ aqui...">
            <button onclick="conectar()">ATIVAR MOTOR</button>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Motor Groq Detectado. Insira a chave gsk_ para carregar as habilidades de design, PDF e IA dos 21 repositórios.</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="O que vamos criar hoje?" onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let CHAVE_GROQ = "";
        const CONTEXTO = `Você é o PapelPrint AI. Você tem o conhecimento técnico de 21 repositórios:
        - Design/Gráfica: Vectorcraft, Designcraft, Figcraft, Gridcraft, CADcraft, Photocraft, Lightcraft, Effectcraft.
        - Documentos: PDFcraft, Wordcraft, Deckcraft.
        - Mídia/Som: Filmcraft, Soundcraft, OpenMAIC.
        - IA: OmniRoute, Claude-mem, Headroom, Vibe Toolkit, OpenClaude, MonkeyCode, MiniMind.
        Responda de forma técnica, prestativa e em português.`;

        function conectar() {
            const k = document.getElementById('apiKey').value.trim();
            if (k.startsWith("gsk_")) {
                CHAVE_GROQ = k;
                document.getElementById('status').innerText = "✅ MOTOR GROQ ONLINE";
                document.getElementById('status').style.color = "#22c55e";
                addMsg("ia", "Habilidades carregadas! O sistema está pronto para operar.");
            } else {
                alert("Use a chave que começa com gsk_");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = "msg " + tipo;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto || !CHAVE_GROQ) return;

            addMsg("user", texto);
            input.value = "";
            document.getElementById('status').innerText = "IA Processando...";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CHAVE_GROQ}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-70b-versatile",
                        messages: [
                            { role: "system", content: CONTEXTO },
                            { role: "user", content: texto }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0].message) {
                    addMsg("ia", data.choices[0].message.content);
                    document.getElementById('status').innerText = "✅ Online";
                } else {
                    addMsg("ia", "Erro na resposta: " + (data.error ? data.error.message : "Desconhecido"));
                }
            } catch (e) {
                addMsg("ia", "Erro de conexão: " + e.message);
            }
        }
    </script>
</body>
</html>
