<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PapelPrint AI - Final</title>
    <style>
        body { background: #0b1020; color: white; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 800px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #29354f; }
        .msg { margin-bottom: 15px; padding: 15px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
        .ia { background: #29354f; border-left: 4px solid #facc15; }
        .user { background: #2563eb; margin-left: 50px; }
        .config { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #facc15; margin-bottom: 10px; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #status { font-size: 12px; margin-top: 10px; color: #facc15; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 PapelPrint AI</h1>
        <div class="config">
            <strong>🔑 Chave API:</strong>
            <input type="password" id="key" placeholder="Cole a chave AQ aqui..." style="width: 50%;">
            <button onclick="conectar()">CONECTAR</button>
            <div id="status">Status: Aguardando chave...</div>
        </div>
        <div class="chat-box" id="chat">
            <div class="msg ia">Olá! O Google está sugerindo modelos que não existem (3.8). Este código vai forçar o uso dos modelos reais (1.5). Cole a chave e vamos testar!</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="O que vamos fazer?">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let API_KEY = "";
        // LISTA DE MODELOS QUE REALMENTE EXISTEM (O 2.5 e 3.8 SÃO FAKES DO GOOGLE)
        const MODELOS_REAIS = ["gemini-1.5-flash", "gemini-1.5-flash-8b", "gemini-1.5-pro"];
        
        const CONTEXTO = "Você é o PapelPrint AI, especialista em Vectorcraft, PDFcraft, Wordcraft e design gráfico. Responda de forma técnica.";

        function conectar() {
            API_KEY = document.getElementById('key').value.trim();
            if(API_KEY) {
                document.getElementById('status').innerText = "IA Pronta. Pronto para forçar modelos reais.";
                document.getElementById('status').style.color = "#22c55e";
                addMsg("ia", "Chave conectada. Vou ignorar as sugestões doidas do Google e usar o Gemini 1.5 Real.");
            }
        }

        function addMsg(t, txt) {
            const c = document.getElementById('chat');
            const d = document.createElement('div');
            d.className = "msg " + t;
            d.innerText = txt;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        async function tentarModelos(prompt) {
            for (let modelo of MODELOS_REAIS) {
                console.log("Tentando modelo: " + modelo);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: CONTEXTO + "\n\nPergunta: " + prompt }] }] })
                    });
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content) {
                        return data.candidates[0].content.parts[0].text;
                    }
                } catch (e) {
                    console.error("Falhou com " + modelo);
                }
            }
            throw new Error("O Google bloqueou todos os modelos reais para esta chave.");
        }

        async function enviar() {
            const ui = document.getElementById('userInput');
            const p = ui.value;
            if (!p || !API_KEY) return;

            addMsg("user", p);
            ui.value = "";
            document.getElementById('status').innerText = "Forçando resposta do motor real...";

            try {
                const resposta = await tentarModelos(p);
                addMsg("ia", resposta);
                document.getElementById('status').innerText = "Online";
            } catch (e) {
                addMsg("ia", "Erro Final: O Google insiste que sua chave não pode usar modelos 1.5. Tente criar uma NOVA CHAVE no AI Studio em outro 'Project'.");
            }
        }
    </script>
</body>
</html>
