<!DOCTYPE html>
<html>
<head>
    <title>PapelPrint AI - Diagnóstico</title>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h1>🔍 DIAGNÓSTICO DE MOTOR PAPELPRINT AI</h1>
    <p>Sua chave (AQ...) foi detectada. Vamos escanear quais habilidades o Google liberou para você.</p>
    
    <input type="password" id="key" placeholder="Cole a chave aqui" style="width: 80%; padding: 10px; margin-bottom: 10px;">
    <br>
    <button onclick="escanear()" style="padding: 10px 20px; cursor: pointer; background: #0f0; color: #000; font-weight: bold;">
        ESCANEAR E INICIAR IA
    </button>
    
    <div id="log" style="margin-top: 20px; border: 1px dashed #0f0; padding: 10px; font-size: 12px;">
        Aguardando comando...
    </div>

    <div id="chat" style="margin-top: 20px; display: none;">
        <hr>
        <h3>💬 CHAT ATIVADO:</h3>
        <input type="text" id="msg" style="width: 70%; padding: 10px;">
        <button onclick="falar()">ENVIAR</button>
        <div id="resIA" style="color: white; margin-top: 10px; background: #222; padding: 10px;"></div>
    </div>

    <script>
        let chaveFinal = "";
        let modeloFuncional = "";

        async function escanear() {
            chaveFinal = document.getElementById('key').value.trim();
            const log = document.getElementById('log');
            log.innerHTML = "Escaneando modelos disponíveis para sua chave...<br>";

            try {
                // Esse comando pergunta ao Google: "O que você deixa eu usar?"
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${chaveFinal}`);
                const data = await resp.json();

                if (data.models && data.models.length > 0) {
                    log.innerHTML += "✅ Modelos encontrados!<br>";
                    // Procura o melhor modelo disponível
                    const flash = data.models.find(m => m.name.includes("flash"));
                    const pro = data.models.find(m => m.name.includes("pro"));
                    
                    modeloFuncional = flash ? flash.name : (pro ? pro.name : data.models[0].name);
                    
                    log.innerHTML += `🚀 Usando motor: <b>${modeloFuncional}</b><br>`;
                    document.getElementById('chat').style.display = "block";
                    log.innerHTML += "<b>MONSTRO SAIU DA JAULA! Digite sua mensagem abaixo.</b>";
                } else {
                    log.innerHTML += "❌ Nenhum modelo disponível. Erro: " + JSON.stringify(data.error);
                }
            } catch (e) {
                log.innerHTML += "❌ Erro de conexão: " + e.message;
            }
        }

        async function falar() {
            const txt = document.getElementById('msg').value;
            const resIA = document.getElementById('resIA');
            resIA.innerText = "IA pensando...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modeloFuncional}:generateContent?key=${chaveFinal}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Você é o PapelPrint AI. Responda: O monstro saiu da jaula! Como posso ajudar com as ferramentas Craft? " + txt }] }] })
                });
                const data = await response.json();
                resIA.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                resIA.innerText = "Erro ao responder: " + e.message;
            }
        }
    </script>
</body>
</html>
