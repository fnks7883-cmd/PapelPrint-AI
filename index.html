<!DOCTYPE html>
<html>
<body style="background: black; color: yellow; font-family: monospace; padding: 50px;">
    <h1>TESTE DE CONEXÃO PAPELPRINT AI</h1>
    <p>Se você está vendo esta tela PRETA E AMARELA, o site atualizou!</p>
    
    <input type="text" id="key" placeholder="Cole a chave AQ aqui" style="width: 300px; padding: 10px;">
    <button onclick="testar()">TESTAR MOTOR AGORA</button>
    
    <div id="resultado" style="margin-top: 20px; border: 1px solid yellow; padding: 20px; min-height: 100px;">
        Aguardando teste...
    </div>

    <script>
        async function testar() {
            const k = document.getElementById('key').value.trim();
            const res = document.getElementById('resultado');
            res.innerText = "Tentando motor v1beta...";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Diga: O monstro saiu da jaula!" }] }] })
                });
                const data = await response.json();
                if (data.candidates) {
                    res.innerHTML = "<h2 style='color: lime'>SUCESSO! Resposta da IA: " + data.candidates[0].content.parts[0].text + "</h2>";
                } else {
                    res.innerHTML = "<h2 style='color: red'>ERRO DO GOOGLE: " + JSON.stringify(data.error) + "</h2>";
                }
            } catch (e) {
                res.innerHTML = "<h2 style='color: red'>ERRO DE REDE: " + e.message + "</h2>";
            }
        }
    </script>
</body>
</html>
