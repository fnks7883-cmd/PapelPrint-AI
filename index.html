<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Oficial (V3)</title>
    <style>
        body { background: #050a18; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 1000px; margin: auto; width: 95%; display: flex; flex-direction: column; height: 90vh; }
        .header { padding: 15px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .chat-box { flex-grow: 1; background: #0f172a; border-radius: 12px; padding: 20px; overflow-y: auto; margin: 15px 0; border: 1px solid #1e293b; }
        .msg { margin-bottom: 15px; padding: 15px; border-radius: 10px; max-width: 85%; line-height: 1.6; white-space: pre-wrap; }
        .ia { background: #1e293b; color: #facc15; align-self: flex-start; border-left: 4px solid #facc15; }
        .user { background: #2563eb; color: white; align-self: flex-end; margin-left: auto; }
        .input-area { display: flex; gap: 10px; background: #1e293b; padding: 15px; border-radius: 12px; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 6px; flex: 1; }
        button { background: #facc15; color: #0f172a; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #status { font-size: 13px; font-weight: bold; color: #facc15; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 PapelPrint AI</h1>
            <div id="status">🔴 AGUARDANDO CHAVE (AIza ou AQ)</div>
        </div>

        <div class="input-area" style="margin-bottom: 10px;">
            <input type="password" id="key" placeholder="Insira aqui sua chave AQ ou AIzaSy...">
            <button onclick="conectar()">ATIVAR MOTOR</button>
        </div>

        <div id="chat" class="chat-box">
            <div class="msg ia">Sistema Pronto. Insira sua credencial para carregar os 21 repositórios e começar.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="O que vamos imprimir/criar hoje?" onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let MINHA_CHAVE = "";
        const REPOS = "Você é o PapelPrint AI. Mestre em: Vectorcraft, PDFcraft, Wordcraft, Lightcraft, Effectcraft, Filmcraft, Designcraft, Figcraft, Gridcraft, CADcraft, Photocraft, Soundcraft, Deckcraft, OpenMAIC, OmniRoute, Vibe Toolkit, Claude-mem, Headroom, OpenClaude, MonkeyCode, MiniMind.";

        function conectar() {
            const k = document.getElementById('key').value.trim();
            if (k.length > 10) { 
                MINHA_CHAVE = k;
                document.getElementById('status').innerText = "🟢 MOTOR CONFIGURADO: " + k.substring(0, 5) + "...";
                document.getElementById('status').style.color = "#22c55e";
                addMsg("ia", "Chave aceita! Tentando estabelecer conexão com o motor Gemini...");
            } else {
                alert("Por favor, insira uma chave válida.");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = "msg " + tipo;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('userInput');
            const p = input.value.trim();
            if (!p || !MINHA_CHAVE) return;

            addMsg("user", p);
            input.value = "";
            document.getElementById('status').innerText = "⚡ PENSANDO...";

            try {
                // Endpoint Gemini 1.5 Flash - Aceita chaves AIza e processa o envio
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MINHA_CHAVE}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: REPOS + "\n\nUsuário: " + p }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    addMsg("ia", data.candidates[0].content.parts[0].text);
                    document.getElementById('status').innerText = "🟢 ONLINE";
                } else if (data.error) {
                    // Se o código AQ não for uma chave de API, o Google retornará o erro aqui
                    addMsg("ia", "Erro na Credencial: " + data.error.message + "\n\nDica: Se o erro for 'API_KEY_INVALID', você precisará usar o código que começa com AIzaSy.");
                    document.getElementById('status').innerText = "❌ ERRO DE CHAVE";
                }
            } catch (e) {
                addMsg("ia", "Erro técnico: " + e.message);
                document.getElementById('status').innerText = "❌ ERRO";
            }
        }
    </script>
</body>
</html>
