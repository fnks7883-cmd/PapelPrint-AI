<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PapelPrint AI - Sistema Operacional</title>
    <style>
        body { background: #050a18; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .container { max-width: 1000px; margin: auto; width: 95%; display: flex; flex-direction: column; height: 90vh; }
        .header { padding: 20px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .chat-box { flex-grow: 1; background: #0f172a; border-radius: 12px; padding: 20px; overflow-y: auto; margin: 20px 0; border: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .msg { margin-bottom: 15px; padding: 15px; border-radius: 10px; max-width: 85%; line-height: 1.6; }
        .ia { background: #1e293b; color: #facc15; align-self: flex-start; border-left: 4px solid #facc15; }
        .user { background: #2563eb; color: white; align-self: flex-end; margin-left: auto; }
        .input-area { display: flex; gap: 10px; background: #1e293b; padding: 15px; border-radius: 12px; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 6px; outline: none; }
        button { background: #facc15; color: #0f172a; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #eab308; }
        #status { font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 PapelPrint AI</h1>
            <div id="status" style="color: #ef4444;">🔴 DESCONECTADO</div>
        </div>

        <div class="input-area" style="margin-bottom: 10px;">
            <input type="password" id="key" placeholder="Cole sua chave AIzaSy aqui..." style="flex: 1;">
            <button onclick="conectar()">CONECTAR MOTOR</button>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Sistema resetado. Por favor, insira sua Chave Gemini (AIza) para carregar os 21 repositórios.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua ordem aqui..." style="flex: 1;" onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let API_KEY = "";
        const PROMPT_SISTEMA = "Você é o PapelPrint AI. Você tem o conhecimento técnico de 21 repositórios: Vectorcraft, PDFcraft, Wordcraft, Lightcraft, Effectcraft, Filmcraft, Designcraft, Figcraft, Gridcraft, CADcraft, Photocraft, Soundcraft, Deckcraft, OpenMAIC, OmniRoute, Vibe Toolkit, Claude-mem, Headroom, OpenClaude, MonkeyCode, MiniMind. Responda de forma técnica e prestativa.";

        function conectar() {
            const k = document.getElementById('key').value.trim();
            if (k.startsWith("AIza")) {
                API_KEY = k;
                document.getElementById('status').innerText = "🟢 MOTOR ATIVO";
                document.getElementById('status').style.color = "#22c55e";
                addMsg("ia", "Motor Gemini detectado e ativo! Habilidades dos 21 repositórios carregadas.");
            } else {
                alert("Erro: A chave deve começar com AIzaSy.");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = "msg " + tipo;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('userInput');
            const texto = input.value;
            if (!texto || !API_KEY) return;

            addMsg("user", texto);
            input.value = "";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: PROMPT_SISTEMA + "\n\nUsuário: " + texto }] }] })
                });
                const data = await res.json();
                if (data.candidates) {
                    addMsg("ia", data.candidates[0].content.parts[0].text);
                } else {
                    addMsg("ia", "Erro na API: " + JSON.stringify(data.error.message));
                }
            } catch (e) {
                addMsg("ia", "Erro de conexão: " + e.message);
            }
        }
    </script>
</body>
</html>
