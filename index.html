<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PapelPrint AI - Motor Groq (Super Rápido)</title>
    <style>
        body { background: #0b1020; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #29354f; }
        .msg { margin-bottom: 15px; padding: 15px; border-radius: 10px; line-height: 1.6; }
        .ia { background: #29354f; border-left: 5px solid #facc15; color: #e2e8f0; }
        .user { background: #2563eb; color: white; margin-left: 50px; }
        .config { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #facc15; margin-bottom: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #29354f; background: #0b1020; color: white; }
        button { background: #facc15; color: #0b1020; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #status { font-size: 12px; color: #facc15; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 PapelPrint AI</h1>
        <div id="status">Status: Pronto para Chave Groq (gsk_...)</div>
        <div class="config">
            <input type="password" id="key" placeholder="Cole sua chave gsk_ aqui...">
            <button onclick="conectar()">LIGAR MOTOR</button>
        </div>
        <div id="chat" class="chat-box"><div class="msg ia">Motor Groq aguardando ignição.</div></div>
        <div class="config">
            <input type="text" id="in" placeholder="Sua mensagem..." onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        let MINHA_CHAVE = "";
        const CONTEXTO = "Você é o PapelPrint AI, especialista nos repositórios Vectorcraft, PDFcraft, Wordcraft, etc. Responda de forma rápida e técnica.";

        function conectar() {
            MINHA_CHAVE = document.getElementById('key').value.trim();
            if(MINHA_CHAVE.startsWith("gsk_")) {
                document.getElementById('status').innerText = "🟢 MOTOR GROQ ATIVO!";
                addMsg("ia", "Motor Groq conectado com sucesso! Habilidades dos 21 repositórios prontas.");
            } else {
                alert("A chave Groq deve começar com gsk_");
            }
        }

        function addMsg(t, m) {
            const c = document.getElementById('chat');
            const d = document.createElement('div');
            d.className = "msg " + t;
            d.innerText = m;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        async function enviar() {
            const input = document.getElementById('in');
            const p = input.value;
            if(!p || !MINHA_CHAVE) return;
            addMsg("user", p);
            input.value = "";
            document.getElementById('status').innerText = "⚡ PENSANDO...";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${MINHA_CHAVE}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-70b-versatile",
                        messages: [
                            { role: "system", content: CONTEXTO },
                            { role: "user", content: p }
                        ]
                    })
                });
                
                const data = await response.json();
                if(data.choices) {
                    addMsg("ia", data.choices[0].message.content);
                    document.getElementById('status').innerText = "🟢 ONLINE";
                } else {
                    addMsg("ia", "Erro na Groq: " + data.error.message);
                }
            } catch(e) {
                addMsg("ia", "Erro de conexão: " + e.message);
            }
        }
    </script>
</body>
</html>
