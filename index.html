<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapelPrint AI - Central Unificada</title>
    <style>
        body { background-color: #0b1020; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        .container { max-width: 900px; margin: auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .chat-box { background: #151c30; flex-grow: 1; border-radius: 10px; padding: 20px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #29354f; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #29354f; background: #0b1020; color: white; outline: none; }
        button { background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #1d4ed8; }
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 12px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; }
        .ia { background: #29354f; align-self: flex-start; border-left: 4px solid #facc15; }
        .user { background: #2563eb; margin-left: auto; }
        .config-bar { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #facc15; display: flex; flex-direction: column; gap: 10px; }
        .badge { background: #ef4444; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🧠 PapelPrint AI <span id="statusBadge" class="badge">OFFLINE</span></h1>
        </header>

        <div class="config-bar">
            <div><strong>🔑 Conexão com o Motor:</strong></div>
            <div style="display:flex; gap:10px;">
                <input type="password" id="apiKey" placeholder="Cole sua chave (AQ...) aqui" style="padding:8px;">
                <button onclick="activate()" style="padding:8px 15px;">Ativar Skills</button>
            </div>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg ia">Olá! Sou o PapelPrint AI. Cole sua chave acima para ativarmos a integração com seus 21 repositórios do GitHub.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Descreva sua tarefa gráfica ou peça ajuda sobre as skills...">
            <button onclick="send()">Enviar</button>
        </div>
        <div id="debug" style="font-size: 11px; color: #64748b; margin-top: 8px;">Aguardando ativação...</div>
    </div>

    <script>
        let KEY = "";
        
        // CONTEXTO COM TODOS OS 21 REPOSITÓRIOS INTEGRADOS COMO SKILLS
        const SYSTEM_PROMPT = `Você é o PapelPrint AI. Você integra as funcionalidades de 21 repositórios do GitHub:
        1. DESIGN E ARTES: Vectorcraft (SVG/Sangria), Designcraft, Figcraft (Figma), Gridcraft, CADcraft, Photocraft, Lightcraft, Effectcraft.
        2. DOCUMENTOS: PDFcraft (Unir/Separar/Preflight), Wordcraft (Timbrados), Deckcraft (Slides).
        3. MÍDIA E EDUCAÇÃO: Filmcraft, Soundcraft, OpenMAIC (Aulas/Agentes).
        4. INFRAESTRUTURA E IA: OmniRoute, Claude-mem, Headroom, Vibe Toolkit, OpenClaude, MonkeyCode, MiniMind.
        Sempre responda como um assistente técnico especializado nessas ferramentas.`;

        function activate() {
            KEY = document.getElementById('apiKey').value.trim();
            if(KEY) {
                document.getElementById('statusBadge').innerText = "IA PRONTA";
                document.getElementById('statusBadge').style.background = "#22c55e";
                addMsg("ia", "Skills ativadas! Agora tenho acesso aos conhecimentos dos 21 repositórios. O que vamos criar?");
            }
        }

        function addMsg(tipo, texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const input = document.getElementById('userInput');
            const prompt = input.value;
            if(!prompt || !KEY) return alert("Ative a chave primeiro!");

            addMsg("user", prompt);
            input.value = "";
            document.getElementById('debug').innerText = "Acessando motor v1beta...";

            try {
                // ENDEREÇO V1BETA - O ÚNICO QUE ACEITA CHAVES NOVAS (AQ...)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: SYSTEM_PROMPT + "\n\nUsuário: " + prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    addMsg("ia", "Erro no motor: " + data.error.message);
                } else {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMsg("ia", reply);
                    document.getElementById('debug').innerText = "Motor rodando liso.";
                }
            } catch (e) {
                addMsg("ia", "Erro de rede. Verifique seu Adblock.");
                document.getElementById('debug').innerText = e.message;
            }
        }
    </script>
</body>
</html>
